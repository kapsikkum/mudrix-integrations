name: Validate

# Checks repo.json with Mudrix's own validator (scripts/validate.mjs is generated from the Mudrix
# source, so it accepts and refuses exactly what Mudrix does), then that repo.json.sig is a valid
# signature of it. No dependencies are installed.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mudrix's checks
        run: node scripts/validate.mjs repo.json && node scripts/validate.mjs --dev examples/dev-repo.json
      - name: Signature
        # A contributor's pull request cannot carry the official signature: the maintainer signs after merging.
        if: github.event_name != 'pull_request'
        run: node scripts/sign.mjs verify repo.json
